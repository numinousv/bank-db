name: Deploy to EC2
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: fedora-44
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm run test:ci
        env:
          CI: true
  deployment:
    needs: test
    name: Deploy
    runs-on: fedora-44
    steps:
      - name: Check out Repo
        uses: actions/checkout@v4
      - name: Copy files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "."
          target: "/home/fedora/banksite"
      - name: Run Docker on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/fedora/banksite
            sudo docker compose down
            sudo docker compose up --build -d
